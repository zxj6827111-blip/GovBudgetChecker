name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    # Playwright 1.42.x dependency installer expects Ubuntu 22.04 package names (e.g. libasound2).
    # ubuntu-latest may currently resolve to 24.04 where those names changed.
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.0

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r api/requirements.txt
          pip install -r tests/requirements-test.txt ruff mypy

      - name: Ruff
        run: ruff check .

      # Task C：禁止把可能含材料原文/凭据的整个对象拼进日志 message。
      # 单独成步是为了让 CI 上一眼能看出是"日志泄漏"红还是普通 lint 红。
      - name: Log message safety
        run: python scripts/check_log_message_safety.py

      # Task 14.1：代码 os.getenv / .env.example / compose 三方对账，
      # 防止再出现"compose 配了但代码不读"（历史案例 RULES_FILE_PATH）这类静默失效。
      - name: Env var consistency
        run: python scripts/check_env_consistency.py

      # Task 14.1：compose 清单静态校验（不启动容器）。
      # 必填变量给占位值，只验证插值与结构，不代表容器能起来。
      - name: Compose config check
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fiscal_db
          GOVBUDGET_API_KEY: ci-config-check
          USER_SESSION_SECRET: ci-config-check
          DEFAULT_ADMIN_PASSWORD: ci-config-check
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ai.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.ai.yml config --services | sort > /tmp/compose-services.txt
          cat /tmp/compose-services.txt
          printf 'ai-extractor\nbackend\nfrontend\npostgres\nworker\n' | diff - /tmp/compose-services.txt

      - name: Mypy
        run: mypy api src tests

      - name: Pytest
        env:
          TESTING: "true"
        run: python -m pytest

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install Node deps
        run: |
          npm ci
          npm --prefix app ci

      - name: Install Playwright browser
        run: npx --prefix app playwright install --with-deps chromium

      - name: Frontend build
        run: npm --prefix app run build

      - name: E2E
        env:
          CI: "true"
        run: npm --prefix app run test:e2e
