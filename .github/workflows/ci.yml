name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    # Playwright 1.42.x dependency installer expects Ubuntu 22.04 package names (e.g. libasound2).
    # ubuntu-latest may currently resolve to 24.04 where those names changed.
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    # Task 15.2 / 缺口 P2-03：CI 此前没有迁移步骤，迁移写错要到部署当天才暴露。
    # 这里起一个一次性 PostgreSQL，用它跑"从空库到最新"的全量迁移。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: govbudget_ci
          POSTGRES_PASSWORD: govbudget_ci
          POSTGRES_DB: fiscal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govbudget_ci -d fiscal_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.0

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r api/requirements.txt
          pip install -r tests/requirements-test.txt ruff mypy

      - name: Ruff
        run: ruff check .

      # Task C：禁止把可能含材料原文/凭据的整个对象拼进日志 message。
      # 单独成步是为了让 CI 上一眼能看出是"日志泄漏"红还是普通 lint 红。
      - name: Log message safety
        run: python scripts/check_log_message_safety.py

      # Task 14.1：代码 os.getenv / .env.example / compose 三方对账，
      # 防止再出现"compose 配了但代码不读"（历史案例 RULES_FILE_PATH）这类静默失效。
      - name: Env var consistency
        run: python scripts/check_env_consistency.py

      # Task 14.1：compose 清单静态校验（不启动容器）。
      # 必填变量给占位值，只验证插值与结构，不代表容器能起来。
      - name: Compose config check
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fiscal_db
          GOVBUDGET_API_KEY: ci-config-check
          USER_SESSION_SECRET: ci-config-check
          DEFAULT_ADMIN_PASSWORD: ci-config-check
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ai.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.ai.yml config --services | sort > /tmp/compose-services.txt
          cat /tmp/compose-services.txt
          printf 'ai-extractor\nbackend\nfrontend\npostgres\nworker\n' | diff - /tmp/compose-services.txt

      - name: Mypy
        run: mypy api src tests

      - name: Pytest
        env:
          TESTING: "true"
        run: python -m pytest

      # Task 15.2 / 缺口 P2-03：从空库跑全量迁移，并断言重复执行幂等
      # （第二遍不得再应用任何迁移）。这是重复部署与回滚的前提。
      - name: DB migrations (fresh database + idempotency)
        env:
          DATABASE_URL: postgresql://govbudget_ci:govbudget_ci@localhost:5432/fiscal_ci
          PG_SCHEMA: public
        run: python scripts/run_db_migrations.py

      # Task 15.2 / 缺口 P2-06：回放结构性指标业务门禁。
      # CI 上没有真实产物语料（`uploads/` 不入版本库，且 pytest 已被隔离到临时目录，
      # 见 tests/conftest.py:isolate_upload_root），所以跑仓库内的 fixture 语料——
      # 它既不必然通过也不必然失败：tests/fixtures/replay/pass 必须全绿，同目录下
      # 5 个 fail_* 语料每个都会精确触发一条检查失败（由 tests/test_ci_business_gate.py 固化）。
      #
      # 刻意**不**在 CI 里判定真实 uploads/：那份语料全是 M1 之前的产物，
      # 一定会把门禁打红（766 个任务 0 个带 page_coverage），在 CI 里挂上去只会逼人
      # 加 `|| true` 变成假门禁。生产环境的判定方式见 docs/CI_BUSINESS_GATE.md 第 5 节。
      #
      # 局限（不得误读）：无 Golden Corpus，本门禁只覆盖结构性指标，
      # **不度量召回率与精确率**，全绿不等于业务质量达标。
      - name: Business gate (replay structural metrics)
        run: python scripts/check_replay_thresholds.py --uploads tests/fixtures/replay/pass

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install Node deps
        run: |
          npm ci
          npm --prefix app ci

      # UI 重建第二批 Task 0：7 个前端单测脚本此前只在本机跑过，从未接入 CI 门禁，
      # 承载 null/0 语义等关键反例的 test:ui-components 因此可能悄悄失效而无人发现。
      # jiti 直跑纯 TS/无 JSX 依赖，不需要浏览器，放在 Playwright 安装之前即可跑。
      - name: Frontend unit tests
        run: npm --prefix app run test:unit

      - name: Install Playwright browser
        run: npx --prefix app playwright install --with-deps chromium

      - name: Frontend build
        run: npm --prefix app run build

      - name: E2E
        env:
          CI: "true"
        run: npm --prefix app run test:e2e
