<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>年度模板与口径 · 交互演示</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.55 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#243247;background:#f3f6fa}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd5e1;border-radius:7px;background:white;padding:8px 13px;color:#273d59}button:hover{border-color:#2872bb}button.primary{color:white;background:#1768b5;border-color:#1768b5}button:disabled{opacity:.45;cursor:not-allowed}h1,h2,h3,p{margin:0 0 12px}small,.muted{color:#64748b}.top{background:#173c63;color:white;padding:12px 24px;display:flex;justify-content:space-between}.demo{background:#fff3ce;padding:9px 24px;color:#765400}.layout{display:grid;grid-template-columns:205px 1fr;min-height:90vh}.side{background:white;border-right:1px solid #dbe3ec;padding:22px 14px}.side button{display:block;width:100%;text-align:left;border:0;margin-bottom:7px}.side .active{background:#eaf3ff;color:#125c9e;font-weight:600}main{padding:24px;max-width:1400px;width:100%;margin:auto}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.card{background:white;border:1px solid #dbe3ec;border-radius:10px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tag{display:inline-block;border-radius:20px;padding:3px 9px;background:#e8f3ff;color:#145c98;font-size:12px}.warn{background:#fff7df;color:#805a00}.bad{background:#fff0ef;color:#a6382f}.good{background:#e5f7ec;color:#17653a}.steps{display:flex;gap:4px;margin:14px 0}.steps button{flex:1}.steps .active{background:#eaf3ff;border-color:#2776c3}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid #e5ebf2;padding:11px 7px;vertical-align:top}label{display:block;font-weight:600;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:8px;background:white}input[type=checkbox],input[type=radio]{width:auto}textarea{min-height:58px}details{padding:10px;background:#f8fafc;border-radius:6px;margin:8px 0}summary{cursor:pointer;font-weight:600}.notice{padding:12px;border-radius:7px;background:#fff6dd;color:#6b500f;margin:12px 0}.evidence{border-left:3px solid #db9c27;padding:8px 12px;background:#fffbef;margin:8px 0}.foot{margin:22px 0;color:#64748b;font-size:12px}.hidden{display:none}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;padding:8px}.side button{min-width:120px}.grid{grid-template-columns:1fr}.steps{flex-wrap:wrap}main{padding:14px}}
</style></head><body><div class="top"><strong>GovBudgetChecker</strong><span>交互设计预览</span></div><div class="demo">演示数据与操作均为虚构，不连接数据库，不上传文件，不提交确认或重算。</div><div class="layout"><aside class="side"><small>管理</small><button onclick="nav('list')" id="nav-list" class="active">系统设置 → 模板管理</button><button onclick="nav('scope')" id="nav-scope">材料复核 → 口径面板</button><button onclick="nav('alternatives')" id="nav-alternatives">布局对比与 D-2</button></aside><main><div id="content"></div><div class="foot">演示中显示的版本、时间、数量、组织与位置仅用于说明交互，不代表系统已有真实记录。</div></main></div><script>
let state={page:'list',step:0,source:'',outcome:'same',year:'2025',reason:'未收到新版，沿用参考',writing:'',amount:'',history:false};const c=document.getElementById('content');function nav(p){state.page=p;document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));document.getElementById('nav-'+(p==='scope'?'scope':p==='alternatives'?'alternatives':'list')).classList.add('active');render()}function go(n){state.step=n;nav('flow')}function options(v,items){return items.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}
function list(){return `<div class="row between"><div><small>系统设置 / 模板管理</small><h1>年度模板管理</h1><p class="muted">维护统一参照、年度适用和已审核能力。</p></div><button class="primary" onclick="go(0)">＋ 上传并比较</button></div><div class="grid"><div class="card"><small>当前已发布版本</small><h2>2024 决算模板 · v1 <span class="tag good">示例 · 已发布</span></h2><p>上海市级 · 部门 / 单位成对模板</p><small>已绑定示例年度：2024、2025　·　适用能力：查看依据</small><div class="actions"><button onclick="go(3)">维护年度适用</button><button onclick="nav('history')">历史与回滚</button><button onclick="nav('impact')">查看影响材料</button></div></div><div class="card"><h3>需要注意</h3><p>2025：未收到新版，沿用参考 <span class="tag warn">未确认无变化</span></p><p>2023：后续年度模板历史参考 <span class="tag warn">不自动判定</span></p><small>示例能力状态不代表实际模板已验证。</small></div></div><div class="card"><h3>模板与适用年度</h3><table><tr><th>文种 / 版本</th><th>来源报告年度</th><th>年度适用</th><th>状态</th><th></th></tr><tr><td>决算 · v1（部门 / 单位）</td><td>2024</td><td>2024 正式 · 2025 参考</td><td><span class="tag good">已发布</span></td><td><button onclick="nav('history')">查看详情</button></td></tr></table></div>`}
function flow(){let steps=['上传来源','查看差异','审核选择','年度适用','启用预览'];let body=[`<h2>1. 上传模板及登记来源</h2><div class="grid"><div><label>部门模板原件（演示）</label><input type="file" onchange="state.source=this.files[0]?.name||''"><label>单位模板原件（演示）</label><input type="file"><label>下发单位</label><input placeholder="填写实际下发单位"></div><div><label>源报告年度</label><input value="2024"><label>下发日期</label><input type="date"><label>来源说明</label><textarea placeholder="填写来源及核实依据"></textarea></div></div><p class="notice">示例仅展示上传表单。正式功能须保留原件、指纹、解析状态及转换错误；原件不完整时不能启用判型能力。</p>`,`<h2>2. 查看差异</h2><p>对照：2024 v1 与待审核来源 <span class="tag warn">以下为虚构示例</span></p><table><tr><th>位置 / 类别</th><th>旧版</th><th>新来源</th><th>影响</th></tr><tr><td>表注 · 写法</td><td>本表反映单位本年度…</td><td>本表反映单位本年度…</td><td>无字面变化</td></tr><tr><td>章节标题 · 年度槽位</td><td>2024年度决算表</td><td>2025年度决算表</td><td>需要审核槽位</td></tr><tr><td>字段与适用条件</td><td>逐项比较</td><td>逐项比较</td><td><span class="tag warn">待人工核实</span></td></tr></table><details><summary>查看原文、位置及检查影响</summary>正式页面在此展示原文位置、字面差异、清单锚点及可能受影响能力，比较结果不能自动变成豁免或规范。</details>`,`<h2>3. 审核差异</h2><label>处理方式</label><select onchange="state.outcome=this.value"><option value="same" ${state.outcome==='same'?'selected':''}>确认无实质变化，沿用已有版本</option><option value="new" ${state.outcome==='new'?'selected':''}>有实质变化，审核并启用新版</option><option value="pending" ${state.outcome==='pending'?'selected':''}>差异尚不明确，保留草稿</option></select><label>审核依据（演示）</label><textarea placeholder="记录核实的差异、条件和验证结果"></textarea><p class="notice">确认无变化需要核实结构、字段、金额单位、科目及适用条件。仅未收到新版不能选择此项。</p>`,`<h2>4. 年度适用</h2><div class="grid"><div><label>目标报告年度</label><input value="${state.year}" oninput="state.year=this.value"><label>适用关系</label><select onchange="state.reason=this.value">${options(state.reason,['已核对无实质变化','未收到新版，沿用参考','历史参考','经审核启用新版'])}</select></div><div><label>发布包</label><select><option>2024 决算 v1（示例）</option><option>待审核的新版本（示例）</option></select><label>获准能力</label><select><option>仅参考与依据展示</option><option>已审核的写法自动判定</option></select></div></div><p class="notice">参考版本不自动证明当年兼容；能力范围必须有审核依据。相同适用键只保留一个当前生效绑定。</p>`,`<h2>5. 审核与启用预览</h2><div class="grid"><div class="card"><h3>准备启用</h3><p>目标年度：${state.year}</p><p>方式：${state.reason}</p><p>示例版本：2024 决算 v1</p><p>能力：仅参考与依据展示</p></div><div class="card"><h3>影响预览</h3><p>旧分析保留；新分析采用新绑定。</p><p>示例：3 份历史分析可能受影响，需用户选择是否重算。</p><button onclick="nav('impact')">查看示例清单</button></div></div><p class="notice">正式启用前校验来源、模板对、审核与验证；启用不自动重算或确认问题。</p><button class="primary" onclick="alert('演示：未保存、未发布。')">确认启用（演示）</button>`][state.step];return `<small>系统设置 / 模板管理 / 来源与适用</small><h1>模板维护</h1><div class="steps">${steps.map((x,i)=>`<button class="${i===state.step?'active':''}" onclick="go(${i})">${i+1} ${x}</button>`).join('')}</div><div class="card">${body}<div class="actions">${state.step?`<button onclick="go(${state.step-1})">上一步</button>`:''}${state.step<4?`<button class="primary" onclick="go(${state.step+1})">下一步</button>`:''}<button onclick="nav('list')">返回列表</button></div></div>`}
function history(){return `<small>系统设置 / 模板管理 / 历史</small><h1>历史与回滚</h1><div class="card"><p>所有修订保留；恢复旧绑定会生成新的生效记录。</p><table><tr><th>时间 / 操作者</th><th>变更</th><th>影响范围</th><th></th></tr><tr><td>示例时间 · 管理员</td><td>2025 沿用 v1 参考</td><td>决算 / 上海 / 2025</td><td><button onclick="state.history=!state.history;render()">预览回滚</button></td></tr><tr><td>示例时间 · 管理员</td><td>发布 2024 v1</td><td>决算 / 上海 / 2024</td><td><button onclick="alert('演示：查看审计包')">查看审计包</button></td></tr></table>${state.history?'<div class="notice">回滚预览：恢复上一有效年度绑定；历史结果不改写。请先查看受影响材料，再确认重算范围。<div class="actions"><button onclick="nav(\'impact\')">查看影响</button><button onclick="alert(\'演示：未执行回滚\')">确认回滚（演示）</button></div></div>':''}</div><button onclick="nav('list')">返回列表</button>`}
function impact(){return `<small>系统设置 / 模板管理 / 影响清单</small><h1>材料影响预览</h1><div class="card"><p>根据版本、年度绑定、算法及实际能力筛选。以下为虚构材料。</p><table><tr><th>选择</th><th>材料</th><th>原分析依据</th><th>影响</th></tr><tr><td><input type="checkbox" aria-label="选择示例材料甲"></td><td>示例单位甲 2025 决算</td><td>2024 v1 · 参考</td><td>写法能力变化</td></tr><tr><td><input type="checkbox" aria-label="选择示例材料乙"></td><td>示例部门乙 2025 决算</td><td>人工写法决定</td><td>相关规则语义变化</td></tr></table><div class="actions"><button onclick="alert('演示：未提交重算')">选择材料重新分析（演示）</button><button onclick="nav('history')">返回历史</button></div><p class="notice">重算生成新分析，保留历史和旧意见；新问题不自动确认。</p></div>`}
function scope(){return `<small>材料复核 / 检查补核</small><h1>材料口径</h1><div class="card"><div class="row"><h2>写法基准</h2><span class="tag bad">冲突 · 待核实</span></div><p>单位侧标题与部门侧表注同时出现；不能按数量多数确定。</p><div class="grid"><div class="evidence"><strong>单位侧</strong><p>示例 p6、p18：年度决算表 / 决算情况说明</p></div><div class="evidence"><strong>部门侧</strong><p>示例 p6、p8、p10：本表反映部门本年度…</p></div></div><details><summary>模板及依据详情</summary>示例：2024 决算 v1；对应年度能力和原文位置需以实际分析为准。</details><label>写法确认</label><select id="writing" onchange="state.writing=this.value">${options(state.writing,['','单位','部门','暂不确定'])}</select><label>写法依据与证据位置</label><textarea placeholder="说明核实依据和页码"></textarea><label><input type="checkbox"> 我已核对反向证据并说明原因</label></div><div class="card"><div class="row"><h2>金额汇总范围</h2><span class="tag warn">待确认</span></div><p>只确认写法不会改变金额值、来源或汇总范围。</p><label>金额范围（可暂不修改）</label><select id="amount" onchange="state.amount=this.value">${options(state.amount,['','仅本级','部门汇总','暂不确定'])}</select><label>金额依据与证据位置</label><textarea placeholder="只有确认金额范围时填写"></textarea><p>是否阻断完成取决于实际未完成检查。</p></div><div class="actions"><button class="primary" onclick="alert('演示：未保存任何决定，也未提交重算')">保存所选维度并重查（演示）</button><button onclick="nav('list')">查看模板</button></div>`}
function alternatives(){return `<h1>布局对比与业务选择</h1><div class="grid"><div class="card"><h2>方案 A · 步骤式维护</h2><p>列表进入上传 → 差异 → 审核 → 年度 → 启用预览，复核材料使用独立口径面板。</p><p>适合低频维护，顺序清晰；核对多项时需要切换步骤。</p><button onclick="go(0)">体验方案 A</button></div><div class="card"><h2>方案 B · 单页工作台</h2><p>同一页面左侧展示模板和年度，右侧展开来源、差异、审核及影响；材料口径仍分维度。</p><p>适合频繁对照，信息集中；单页内容较多。此方案为结构草图，业务步骤与 A 相同。</p><button onclick="alert('方案 B 草图：左侧版本与年度列表；右侧选中项的来源、差异、审核和影响分区。')">查看结构说明</button></div></div><div class="card"><h2>D-2 · 单位模板原句</h2><p>单位模板在预算绩效章节含“本部门建立了…”。下列选择只针对经审核的模板版本、章节与完整句子。</p><label><input type="radio" name="d2"> A：按清单报 low，并注明模板来源</label><label><input type="radio" name="d2"> B：该位置不报，不扩大到其他位置</label><p class="notice">这里的选择仅用于演示，不会保存业务决定。请在聊天中明确选择。</p></div>`}
function render(){c.innerHTML=state.page==='list'?list():state.page==='flow'?flow():state.page==='history'?history():state.page==='impact'?impact():state.page==='scope'?scope():alternatives()}render();
</script></body></html>
