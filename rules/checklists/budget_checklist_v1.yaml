# 预算报告检查点清单（系统默认检查指标）
# 来源：《普陀区财政预算报告检查点清单（系统核查用）v1.0》；2026-10-22 起作为全系统检查指标，
# 不按地区单列。每条检查点映射到检查义务（src/engine/check_obligations.py）与规则编号，
# tests/test_checklist_catalog.py 校验映射完整、义务存在、规则已注册。
# status: implemented=确定性规则覆盖；partial=部分要素覆盖（见 note）；
#         ai_assisted=确定性词表提示+AI 语义复核；external=不属 PDF 内容规则（下载环节/上传入口）。
# decision（非 implemented 条目必填，2026-10-22 用户决议）：closed=按决议不再自动化，
#         deferred=暂缓待条件具备，ai_only=规则只作提示、进一步判断只交大模型 AI。
